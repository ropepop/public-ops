schema: 1
module_id: rigassatiksme_qr_bot
owner: arbuzas
runtime:
  type: external
  healthcheck: docker compose --project-name arbuzas --env-file /etc/arbuzas/current/release.env -f /etc/arbuzas/current/infra/arbuzas/docker/compose.yml ps rigassatiksme_qr_bot >/dev/null
  run_id_env: ARBUZAS_RELEASE_ID
components:
  - id: rigassatiksme_qr_bot
    start: docker compose --project-name arbuzas --env-file /etc/arbuzas/current/release.env -f /etc/arbuzas/current/infra/arbuzas/docker/compose.yml up -d ticket_phone_bridge phone_broker rigassatiksme_qr_bot
    stop: docker compose --project-name arbuzas --env-file /etc/arbuzas/current/release.env -f /etc/arbuzas/current/infra/arbuzas/docker/compose.yml stop rigassatiksme_qr_bot
    health: docker compose --project-name arbuzas --env-file /etc/arbuzas/current/release.env -f /etc/arbuzas/current/infra/arbuzas/docker/compose.yml ps rigassatiksme_qr_bot >/dev/null
    redeploy:
      mode: compose_release
      release_root: /etc/arbuzas/releases
observability:
  event_source: rigassatiksme_qr_bot
  evidence_root: ops/evidence/rigassatiksme-qr-bot
