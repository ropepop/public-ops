# Preserve the owner's deliberately public root password and key access while
# reducing the unauthenticated and forwarding surface.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods any
PermitEmptyPasswords no
MaxAuthTries 4
LoginGraceTime 30
MaxSessions 5
MaxStartups 10:30:60
PerSourceMaxStartups 3
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no
PermitTunnel no
