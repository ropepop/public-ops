services:
  portainer:
    image: ${ARBUZAS_PORTAINER_IMAGE}
    command:
      - -H
      - unix:///var/run/docker.sock
    ports:
      - target: 9443
        published: 9443
        protocol: tcp
        mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/arbuzas/portainer:/data

  train_bot:
    image: arbuzas/train-bot:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/train-bot.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/train-bot
    environment:
      TZ: ${ARBUZAS_TZ}
      TRAIN_WEB_ENABLED: "true"
      TRAIN_WEB_BIND_ADDR: 0.0.0.0
      TRAIN_WEB_PORT: ${ARBUZAS_TRAIN_BOT_PORT}
      TRAIN_WEB_PUBLIC_BASE_URL: https://${ARBUZAS_TRAIN_BOT_HOSTNAME}
      TRAIN_WEB_SPACETIME_OIDC_ISSUER: https://${ARBUZAS_TRAIN_BOT_HOSTNAME}/oidc
      TRAIN_RUNTIME_SPACETIME_OIDC_ISSUER: https://${ARBUZAS_TRAIN_BOT_HOSTNAME}/oidc
      TRAIN_WEB_TEST_LOGIN_ENABLED: "false"
      SCHEDULE_DIR: /srv/train-bot/data/schedules
      SCRAPER_OUTPUT_DIR: /srv/train-bot/data/schedules
      TRAIN_WEB_BUNDLE_DIR: /srv/train-bot/data/public-bundles
      TRAIN_WEB_PUBLIC_EDGE_CACHE_STATE_FILE: /srv/train-bot/state/public-edge-cache.json
      SINGLE_INSTANCE_LOCK_PATH: /srv/train-bot/run/train-bot.lock
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/train-bot/.env
        set +a
        # Keep container-managed runtime settings ahead of legacy host env values.
        export TRAIN_WEB_ENABLED="true"
        export TRAIN_WEB_BIND_ADDR="0.0.0.0"
        export TRAIN_WEB_PORT="${ARBUZAS_TRAIN_BOT_PORT}"
        export TRAIN_WEB_PUBLIC_BASE_URL="https://${ARBUZAS_TRAIN_BOT_HOSTNAME}"
        export TRAIN_WEB_SPACETIME_OIDC_ISSUER="https://${ARBUZAS_TRAIN_BOT_HOSTNAME}/oidc"
        export TRAIN_RUNTIME_SPACETIME_OIDC_ISSUER="https://${ARBUZAS_TRAIN_BOT_HOSTNAME}/oidc"
        export TRAIN_WEB_TEST_LOGIN_ENABLED="false"
        export SCHEDULE_DIR="/srv/train-bot/data/schedules"
        export SCRAPER_OUTPUT_DIR="/srv/train-bot/data/schedules"
        export TRAIN_WEB_BUNDLE_DIR="/srv/train-bot/data/public-bundles"
        export TRAIN_WEB_PUBLIC_EDGE_CACHE_STATE_FILE="/srv/train-bot/state/public-edge-cache.json"
        export SINGLE_INSTANCE_LOCK_PATH="/srv/train-bot/run/train-bot.lock"
        mkdir -p /srv/train-bot/run /srv/train-bot/state /srv/train-bot/data/schedules /srv/train-bot/data/public-bundles
        exec /usr/local/bin/train-bot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_TRAIN_BOT_PORT}/api/v1/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - /srv/arbuzas/train-bot:/srv/train-bot
      - /etc/arbuzas/env/train-bot.env:/srv/train-bot/.env:ro
      - /etc/arbuzas/secrets:/etc/arbuzas/secrets:ro

  satiksme_bot:
    image: arbuzas/satiksme-bot:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/satiksme-bot.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/satiksme-bot
    environment:
      TZ: ${ARBUZAS_TZ}
      SATIKSME_WEB_ENABLED: "true"
      SATIKSME_WEB_BIND_ADDR: 0.0.0.0
      SATIKSME_WEB_PORT: ${ARBUZAS_SATIKSME_BOT_PORT}
      SATIKSME_WEB_PUBLIC_BASE_URL: https://${ARBUZAS_SATIKSME_BOT_HOSTNAME}
      DB_PATH: /srv/satiksme-bot/state/satiksme_bot.db
      SINGLE_INSTANCE_LOCK_PATH: /srv/satiksme-bot/run/satiksme-bot.lock
      SATIKSME_CATALOG_MIRROR_DIR: /srv/satiksme-bot/data/catalog/source
      SATIKSME_CATALOG_OUTPUT_PATH: /srv/satiksme-bot/data/catalog/generated/catalog.json
      SATIKSME_WEB_BUNDLE_DIR: /srv/satiksme-bot/data/public-bundles
      SATIKSME_WEB_LIVE_SNAPSHOT_DIR: /srv/satiksme-bot/state/live-snapshot
      SATIKSME_WEB_LIVE_VIEWER_HEARTBEAT_ENABLED: "true"
      SATIKSME_CHAT_ANALYZER_SESSION_FILE: /srv/satiksme-bot/state/chat-analyzer.session
      SATIKSME_CHAT_ANALYZER_MODEL_PROVIDER: google
      SATIKSME_CHAT_ANALYZER_MODEL_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      SATIKSME_CHAT_ANALYZER_MODEL_NAME: auto
      SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_AUTO: "true"
      SATIKSME_CHAT_ANALYZER_GOOGLE_MODELS_URL: https://generativelanguage.googleapis.com/v1beta/models
      SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_POLICY: free_rpd_parameter
      SATIKSME_CHAT_ANALYZER_MODEL_NATIVE_OLLAMA: "false"
      SATIKSME_CHAT_ANALYZER_DRY_RUN: "false"
      SATIKSME_CHAT_ANALYZER_PROCESS_START: "05:30"
      SATIKSME_CHAT_ANALYZER_PROCESS_END: "01:00"
      SATIKSME_CHAT_ANALYZER_POLL_INTERVAL: 30s
      SATIKSME_CHAT_ANALYZER_PROCESS_INTERVAL: 5m
      SATIKSME_CHAT_ANALYZER_BATCH_LIMIT: "25"
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/satiksme-bot/.env
        set +a
        # Keep container-managed runtime settings ahead of legacy host env values.
        export SATIKSME_WEB_ENABLED="true"
        export SATIKSME_WEB_BIND_ADDR="0.0.0.0"
        export SATIKSME_WEB_PORT="${ARBUZAS_SATIKSME_BOT_PORT}"
        export SATIKSME_WEB_PUBLIC_BASE_URL="https://${ARBUZAS_SATIKSME_BOT_HOSTNAME}"
        export DB_PATH="/srv/satiksme-bot/state/satiksme_bot.db"
        export SINGLE_INSTANCE_LOCK_PATH="/srv/satiksme-bot/run/satiksme-bot.lock"
        export SATIKSME_CATALOG_MIRROR_DIR="/srv/satiksme-bot/data/catalog/source"
        export SATIKSME_CATALOG_OUTPUT_PATH="/srv/satiksme-bot/data/catalog/generated/catalog.json"
        export SATIKSME_WEB_BUNDLE_DIR="/srv/satiksme-bot/data/public-bundles"
        export SATIKSME_WEB_LIVE_SNAPSHOT_DIR="/srv/satiksme-bot/state/live-snapshot"
        export SATIKSME_WEB_LIVE_VIEWER_HEARTBEAT_ENABLED="true"
        export SATIKSME_CHAT_ANALYZER_SESSION_FILE="${SATIKSME_CHAT_ANALYZER_SESSION_FILE:-/srv/satiksme-bot/state/chat-analyzer.session}"
        export SATIKSME_CHAT_ANALYZER_MODEL_PROVIDER="${SATIKSME_CHAT_ANALYZER_MODEL_PROVIDER:-google}"
        export SATIKSME_CHAT_ANALYZER_MODEL_BASE_URL="${SATIKSME_CHAT_ANALYZER_MODEL_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}"
        export SATIKSME_CHAT_ANALYZER_MODEL_NAME="${SATIKSME_CHAT_ANALYZER_MODEL_NAME:-auto}"
        export SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_AUTO="${SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_AUTO:-true}"
        export SATIKSME_CHAT_ANALYZER_GOOGLE_MODELS_URL="${SATIKSME_CHAT_ANALYZER_GOOGLE_MODELS_URL:-https://generativelanguage.googleapis.com/v1beta/models}"
        export SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_POLICY="${SATIKSME_CHAT_ANALYZER_GOOGLE_MODEL_POLICY:-free_rpd_parameter}"
        export SATIKSME_CHAT_ANALYZER_MODEL_NATIVE_OLLAMA="${SATIKSME_CHAT_ANALYZER_MODEL_NATIVE_OLLAMA:-false}"
        export SATIKSME_CHAT_ANALYZER_DRY_RUN="${SATIKSME_CHAT_ANALYZER_DRY_RUN:-false}"
        export SATIKSME_CHAT_ANALYZER_PROCESS_START="${SATIKSME_CHAT_ANALYZER_PROCESS_START:-05:30}"
        export SATIKSME_CHAT_ANALYZER_PROCESS_END="${SATIKSME_CHAT_ANALYZER_PROCESS_END:-01:00}"
        export SATIKSME_CHAT_ANALYZER_POLL_INTERVAL="${SATIKSME_CHAT_ANALYZER_POLL_INTERVAL:-30s}"
        export SATIKSME_CHAT_ANALYZER_PROCESS_INTERVAL="${SATIKSME_CHAT_ANALYZER_PROCESS_INTERVAL:-5m}"
        export SATIKSME_CHAT_ANALYZER_BATCH_LIMIT="${SATIKSME_CHAT_ANALYZER_BATCH_LIMIT:-25}"
        mkdir -p \
          /srv/satiksme-bot/run \
          /srv/satiksme-bot/state \
          /srv/satiksme-bot/data/catalog/source \
          /srv/satiksme-bot/data/catalog/generated \
          /srv/satiksme-bot/data/public-bundles
        exec /usr/local/bin/satiksme-bot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_SATIKSME_BOT_PORT}/api/v1/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - /srv/arbuzas/satiksme-bot:/srv/satiksme-bot
      - /etc/arbuzas/env/satiksme-bot.env:/srv/satiksme-bot/.env:ro
      - /etc/arbuzas/secrets:/etc/arbuzas/secrets:ro

  subscription_bot:
    image: arbuzas/subscription-bot:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/subscription-bot.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/subscription-bot
    environment:
      TZ: ${ARBUZAS_TZ}
      SUBSCRIPTION_BOT_WEB_ENABLED: "true"
      SUBSCRIPTION_BOT_WEB_BIND_ADDR: 0.0.0.0
      SUBSCRIPTION_BOT_WEB_PORT: ${ARBUZAS_SUBSCRIPTION_BOT_PORT}
      SUBSCRIPTION_BOT_DB_PATH: /srv/subscription-bot/state/subscription_bot.db
      SUBSCRIPTION_BOT_SINGLE_INSTANCE_LOCK_PATH: /srv/subscription-bot/run/subscription-bot.lock
      SUBSCRIPTION_BOT_SESSION_SECRET_FILE: /srv/subscription-bot/state/subscription-bot.session.secret
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/subscription-bot/.env
        set +a
        # Keep container-managed runtime settings ahead of legacy host env values.
        export SUBSCRIPTION_BOT_WEB_ENABLED="true"
        export SUBSCRIPTION_BOT_WEB_BIND_ADDR="0.0.0.0"
        export SUBSCRIPTION_BOT_WEB_PORT="${ARBUZAS_SUBSCRIPTION_BOT_PORT}"
        export SUBSCRIPTION_BOT_DB_PATH="/srv/subscription-bot/state/subscription_bot.db"
        export SUBSCRIPTION_BOT_SINGLE_INSTANCE_LOCK_PATH="/srv/subscription-bot/run/subscription-bot.lock"
        export SUBSCRIPTION_BOT_SESSION_SECRET_FILE="/srv/subscription-bot/state/subscription-bot.session.secret"
        mkdir -p /srv/subscription-bot/run /srv/subscription-bot/state
        exec /usr/local/bin/subscription-bot
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_SUBSCRIPTION_BOT_PORT}/pixel-stack/subscription/api/v1/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    volumes:
      - /srv/arbuzas/subscription-bot:/srv/subscription-bot
      - /etc/arbuzas/env/subscription-bot.env:/srv/subscription-bot/.env:ro
      - /etc/arbuzas/secrets:/etc/arbuzas/secrets:ro

  ticket_phone_bridge:
    image: arbuzas/ticket-phone-bridge:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/ticket-phone-bridge.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    environment:
      TZ: ${ARBUZAS_TZ}
      TICKET_PHONE_ADB_TARGET: ${ARBUZAS_TICKET_PHONE_ADB_TARGET}
      TICKET_PHONE_DEVICE_PORT: "9388"
      TICKET_PHONE_ADB_FORWARD_PORT: "19389"
      TICKET_PHONE_BRIDGE_PORT: "9388"
      TICKET_PHONE_HEALTH_INTERVAL: "5"
      TICKET_PHONE_HEALTH_TIMEOUT: "2"
      TICKET_PHONE_BRIDGE_EVENT_SINK_URL: http://ticket_remote:${ARBUZAS_TICKET_REMOTE_PORT}/api/v1/internal/service-events
      TICKET_PHONE_BRIDGE_EVENT_SINK_TOKEN: ${ARBUZAS_TICKET_REMOTE_SERVICE_EVENT_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/usr/local/bin/ticket-phone-bridge-health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - /etc/arbuzas/secrets/android-adb/adbkey:/root/.android/adbkey:ro
      - /etc/arbuzas/secrets/android-adb/adbkey.pub:/root/.android/adbkey.pub:ro
      - /etc/arbuzas/secrets/android-adb/adb_known_hosts.pb:/root/.android/adb_known_hosts.pb:ro

  phone_broker:
    image: arbuzas/phone-broker:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/phone-broker.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/phone-broker
    environment:
      TZ: ${ARBUZAS_TZ}
      PHONE_BROKER_BIND_ADDR: 0.0.0.0
      PHONE_BROKER_PORT: ${ARBUZAS_PHONE_BROKER_PORT}
      PHONE_BROKER_UPSTREAM_BASE_URL: http://ticket_phone_bridge:9388
      PHONE_BROKER_TICKET_GRACE: 10s
      PHONE_BROKER_EVENT_SINK_URL: http://ticket_remote:${ARBUZAS_TICKET_REMOTE_PORT}/api/v1/internal/service-events
      PHONE_BROKER_EVENT_SINK_TOKEN: ${ARBUZAS_TICKET_REMOTE_SERVICE_EVENT_TOKEN:-}
    command:
      - /bin/sh
      - -lc
      - |
        export PHONE_BROKER_BIND_ADDR="0.0.0.0"
        export PHONE_BROKER_PORT="${ARBUZAS_PHONE_BROKER_PORT}"
        export PHONE_BROKER_UPSTREAM_BASE_URL="$${PHONE_BROKER_UPSTREAM_BASE_URL:-http://ticket_phone_bridge:9388}"
        export PHONE_BROKER_TICKET_GRACE="$${PHONE_BROKER_TICKET_GRACE:-10s}"
        export PHONE_BROKER_EVENT_SINK_URL="$${PHONE_BROKER_EVENT_SINK_URL:-http://ticket_remote:${ARBUZAS_TICKET_REMOTE_PORT}/api/v1/internal/service-events}"
        export PHONE_BROKER_EVENT_SINK_TOKEN="$${PHONE_BROKER_EVENT_SINK_TOKEN:-}"
        mkdir -p /srv/phone-broker/run
        exec /usr/local/bin/phone-broker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_PHONE_BROKER_PORT}/api/v1/health >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    depends_on:
      - ticket_phone_bridge
    volumes:
      - /srv/arbuzas/phone-broker:/srv/phone-broker

  chatgpt_broker:
    image: arbuzas/chatgpt-broker:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/chatgpt-broker.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/chatgpt-broker
    environment:
      TZ: ${ARBUZAS_TZ}
      CHATGPT_BROKER_BIND_ADDR: 0.0.0.0
      CHATGPT_BROKER_PORT: ${ARBUZAS_CHATGPT_BROKER_PORT}
    command:
      - /bin/sh
      - -lc
      - |
        if [ -f /srv/chatgpt-broker/.env ]; then
          set -a
          . /srv/chatgpt-broker/.env
          set +a
        fi
        export CHATGPT_BROKER_BIND_ADDR="0.0.0.0"
        export CHATGPT_BROKER_PORT="${ARBUZAS_CHATGPT_BROKER_PORT}"
        mkdir -p /srv/chatgpt-broker/run /srv/chatgpt-broker/state
        exec /usr/local/bin/chatgpt-broker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_CHATGPT_BROKER_PORT}/healthz >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - /srv/arbuzas/chatgpt-broker:/srv/chatgpt-broker
      - /etc/arbuzas/env/chatgpt-broker.env:/srv/chatgpt-broker/.env:ro
      - /etc/arbuzas/secrets/ticket-remote:/run/secrets/ticket-remote:ro

  chatgpt_bot:
    image: arbuzas/chatgpt-bot:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/chatgpt-bot.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/chatgpt-bot
    environment:
      TZ: ${ARBUZAS_TZ}
      CHATGPT_BROKER_BASE_URL: http://chatgpt_broker:${ARBUZAS_CHATGPT_BROKER_PORT}
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/chatgpt-bot/.env
        set +a
        export CHATGPT_BROKER_BASE_URL="$${CHATGPT_BROKER_BASE_URL:-http://chatgpt_broker:${ARBUZAS_CHATGPT_BROKER_PORT}}"
        exec /usr/local/bin/chatgpt-bot
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    depends_on:
      - chatgpt_broker
    volumes:
      - /srv/arbuzas/chatgpt-bot:/srv/chatgpt-bot
      - /etc/arbuzas/env/chatgpt-broker.env:/srv/chatgpt-bot/.env:ro

  ticket_remote_spacetime_sidecar:
    image: arbuzas/ticket-remote-spacetime-sidecar:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/ticket-remote-spacetime-sidecar.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/ticket-remote-spacetime-sidecar
    environment:
      TZ: ${ARBUZAS_TZ}
      TICKET_REMOTE_SPACETIME_SIDECAR_BIND_ADDR: 0.0.0.0:9346
      TICKET_REMOTE_TICKET_ID: vivi-default
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/ticket-remote/.env
        set +a
        export TICKET_REMOTE_SPACETIME_SIDECAR_BIND_ADDR="$${TICKET_REMOTE_SPACETIME_SIDECAR_BIND_ADDR:-0.0.0.0:9346}"
        export TICKET_REMOTE_TICKET_ID="$${TICKET_REMOTE_TICKET_ID:-vivi-default}"
        exec /usr/local/bin/ticket-remote-spacetime-sidecar
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9346/healthz >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    volumes:
      - /srv/arbuzas/ticket-remote:/srv/ticket-remote
      - /etc/arbuzas/env/ticket-remote.env:/srv/ticket-remote/.env:ro
      - /etc/arbuzas/secrets/ticket-remote:/run/secrets/ticket-remote:ro

  ticket_remote:
    image: arbuzas/ticket-remote:${ARBUZAS_RELEASE_ID}
    build:
      context: ../../..
      dockerfile: infra/arbuzas/docker/images/ticket-remote.Dockerfile
      args:
        ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
        ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
        ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
        ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
    working_dir: /srv/ticket-remote
    environment:
      ARBUZAS_RELEASE_ID: ${ARBUZAS_RELEASE_ID}
      ARBUZAS_RELEASE_SOURCE_COMMIT: ${ARBUZAS_RELEASE_SOURCE_COMMIT}
      ARBUZAS_RELEASE_SOURCE_DIRTY: ${ARBUZAS_RELEASE_SOURCE_DIRTY}
      ARBUZAS_RELEASE_SOURCE_SHA256: ${ARBUZAS_RELEASE_SOURCE_SHA256}
      TZ: ${ARBUZAS_TZ}
      TICKET_REMOTE_BIND_ADDR: 0.0.0.0
      TICKET_REMOTE_PORT: ${ARBUZAS_TICKET_REMOTE_PORT}
      TICKET_REMOTE_PRODUCTION: "true"
      TICKET_REMOTE_PUBLIC_BASE_URL: https://${ARBUZAS_TICKET_REMOTE_HOSTNAME}
      TICKET_REMOTE_AUTH_MODE: ${ARBUZAS_TICKET_REMOTE_AUTH_MODE:-spacetime}
      TICKET_REMOTE_STATE_BACKEND: spacetime
      TICKET_REMOTE_CF_ACCESS_TEAM_DOMAIN: ${ARBUZAS_TICKET_REMOTE_CF_ACCESS_TEAM_DOMAIN:-}
      TICKET_REMOTE_CF_ACCESS_AUDIENCE: ${ARBUZAS_TICKET_REMOTE_CF_ACCESS_AUDIENCE:-}
      TICKET_REMOTE_SPACETIME_AUTH_ISSUER: ${ARBUZAS_TICKET_REMOTE_SPACETIME_AUTH_ISSUER:-https://auth.spacetimedb.com/oidc}
      TICKET_REMOTE_SPACETIME_AUTH_CLIENT_ID: ${ARBUZAS_TICKET_REMOTE_SPACETIME_AUTH_CLIENT_ID}
      TICKET_REMOTE_SPACETIME_AUTH_REDIRECT_URL: https://${ARBUZAS_TICKET_REMOTE_HOSTNAME}/auth/callback
      TICKET_REMOTE_SPACETIME_CLIENT_URL: http://ticket_remote_spacetime_sidecar:9346
      TICKET_REMOTE_BOOTSTRAP_ADMIN_EMAIL: ticket@jolkins.id.lv
      TICKET_REMOTE_COOKIE_TTL: 720h
      TICKET_REMOTE_PHONE_BACKENDS: pixel|Pixel|http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}
      TICKET_REMOTE_DEFAULT_PHONE_BACKEND_ID: pixel
      TICKET_REMOTE_ACTIVE_PHONE_BACKEND_FILE: /srv/ticket-remote/state/active-phone-backend.json
      TICKET_REMOTE_PHONE_BACKEND_ID: pixel
      TICKET_REMOTE_PHONE_ATTACH_NAME: Pixel
      TICKET_REMOTE_PHONE_BASE_URL: http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}
      TICKET_REMOTE_PHONE_BROKER_URL: http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}
      TICKET_REMOTE_PHONE_NO_VIEWER_STOP_DELAY: 60s
      TICKET_REMOTE_SERVICE_EVENT_TOKEN: ${ARBUZAS_TICKET_REMOTE_SERVICE_EVENT_TOKEN:-}
    command:
      - /bin/sh
      - -lc
      - |
        set -a
        . /srv/ticket-remote/.env
        set +a
        export TICKET_REMOTE_BIND_ADDR="0.0.0.0"
        export TICKET_REMOTE_PORT="${ARBUZAS_TICKET_REMOTE_PORT}"
        export TICKET_REMOTE_PRODUCTION="$${TICKET_REMOTE_PRODUCTION:-true}"
        export TICKET_REMOTE_PUBLIC_BASE_URL="https://${ARBUZAS_TICKET_REMOTE_HOSTNAME}"
        export TICKET_REMOTE_AUTH_MODE="$${TICKET_REMOTE_AUTH_MODE:-spacetime}"
        export TICKET_REMOTE_STATE_BACKEND="$${TICKET_REMOTE_STATE_BACKEND:-spacetime}"
        export TICKET_REMOTE_CF_ACCESS_TEAM_DOMAIN="$${TICKET_REMOTE_CF_ACCESS_TEAM_DOMAIN:-}"
        export TICKET_REMOTE_CF_ACCESS_AUDIENCE="$${TICKET_REMOTE_CF_ACCESS_AUDIENCE:-}"
        export TICKET_REMOTE_SPACETIME_AUTH_ISSUER="$${TICKET_REMOTE_SPACETIME_AUTH_ISSUER:-https://auth.spacetimedb.com/oidc}"
        export TICKET_REMOTE_SPACETIME_AUTH_CLIENT_ID="$${TICKET_REMOTE_SPACETIME_AUTH_CLIENT_ID:-}"
        export TICKET_REMOTE_SPACETIME_AUTH_REDIRECT_URL="$${TICKET_REMOTE_SPACETIME_AUTH_REDIRECT_URL:-https://${ARBUZAS_TICKET_REMOTE_HOSTNAME}/auth/callback}"
        export TICKET_REMOTE_SPACETIME_CLIENT_URL="$${TICKET_REMOTE_SPACETIME_CLIENT_URL:-http://ticket_remote_spacetime_sidecar:9346}"
        export TICKET_REMOTE_BOOTSTRAP_ADMIN_EMAIL="$${TICKET_REMOTE_BOOTSTRAP_ADMIN_EMAIL:-ticket@jolkins.id.lv}"
        export TICKET_REMOTE_COOKIE_TTL="$${TICKET_REMOTE_COOKIE_TTL:-720h}"
        export TICKET_REMOTE_PHONE_BACKENDS="$${TICKET_REMOTE_PHONE_BACKENDS:-pixel|Pixel|http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}}"
        export TICKET_REMOTE_DEFAULT_PHONE_BACKEND_ID="$${TICKET_REMOTE_DEFAULT_PHONE_BACKEND_ID:-pixel}"
        export TICKET_REMOTE_ACTIVE_PHONE_BACKEND_FILE="$${TICKET_REMOTE_ACTIVE_PHONE_BACKEND_FILE:-/srv/ticket-remote/state/active-phone-backend.json}"
        export TICKET_REMOTE_PHONE_BACKEND_ID="$${TICKET_REMOTE_PHONE_BACKEND_ID:-pixel}"
        export TICKET_REMOTE_PHONE_ATTACH_NAME="$${TICKET_REMOTE_PHONE_ATTACH_NAME:-Pixel}"
        export TICKET_REMOTE_PHONE_BASE_URL="$${TICKET_REMOTE_PHONE_BASE_URL:-http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}}"
        export TICKET_REMOTE_PHONE_BROKER_URL="$${TICKET_REMOTE_PHONE_BROKER_URL:-http://phone_broker:${ARBUZAS_PHONE_BROKER_PORT}}"
        export TICKET_REMOTE_PHONE_NO_VIEWER_STOP_DELAY="$${TICKET_REMOTE_PHONE_NO_VIEWER_STOP_DELAY:-60s}"
        export TICKET_REMOTE_SERVICE_EVENT_TOKEN="$${TICKET_REMOTE_SERVICE_EVENT_TOKEN:-}"
        mkdir -p /srv/ticket-remote/run /srv/ticket-remote/state
        exec /usr/local/bin/ticket-remote
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${ARBUZAS_TICKET_REMOTE_PORT}/api/v1/livez >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
    depends_on:
      - phone_broker
      - ticket_remote_spacetime_sidecar
    volumes:
      - /srv/arbuzas/ticket-remote:/srv/ticket-remote
      - /etc/arbuzas/env/ticket-remote.env:/srv/ticket-remote/.env:ro
      - /etc/arbuzas/secrets/ticket-remote:/run/secrets/ticket-remote:ro

