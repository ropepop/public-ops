services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui@sha256:344f7a68a91e59d592fc355d67e32d8c2041b1c2082a7eaa3c413dc3a5cab7db
    container_name: tiny-vless-3xui
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_INIT_WEB_BASE_PATH: "${XUI_INIT_WEB_BASE_PATH}"
      XUI_WEB_BASE_PATH: "${XUI_WEB_BASE_PATH}"
      XUI_USERNAME: "${XUI_USERNAME}"
      XUI_PASSWORD: "${XUI_PASSWORD}"
      XUI_API_TOKEN: "${XUI_API_TOKEN}"
      XUI_LOG_LEVEL: "warning"
      XUI_DEBUG: "false"
    volumes:
      - /opt/tiny-vless/db:/etc/x-ui
      - /etc/arbuzas/secrets/tiny-vless/cert:/root/cert
    ports:
      - "127.0.0.1:${LOCAL_PANEL_PORT}:2053/tcp"
      - "127.0.0.1:12096:2096/tcp"
      - "0.0.0.0:${PUBLIC_VLESS_PORT}:${PUBLIC_VLESS_PORT}/tcp"
      - "0.0.0.0:8446:8446/tcp"
      - "${PUBLIC_VLESS_ADDRESS:-38.45.80.240}:443:443/tcp"
      - "0.0.0.0:8447:8447/udp"
      - "0.0.0.0:8444:8444/udp"
      - "0.0.0.0:8445:8445/udp"
      - "0.0.0.0:51820:51820/udp"
    networks:
      tinyvpn_net:
        ipv4_address: 172.30.77.2
    cpuset: "0-1"
    cpus: "1.50"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  tinyvpn_net:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.77.0/24
