# Keep the host-service section focused on the services that make the
# kitty-gration runtime and private dashboard available.
update_every: 5
jobs:
  - name: kitty-gration-core
    include:
      - containerd.service
      - docker.service
      - netdata.service
      - ssh.service
      - tailscaled.service
    labels:
      tier: host
      environment: production
