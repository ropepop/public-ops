[global]
    # Give the single-node dashboard a stable, human-readable identity.
    hostname = kitty-gration
    profile = standalone

[db]
    # Keep useful short-, medium-, and long-range history without allowing the
    # monitoring database to grow to the multi-gigabyte Agent defaults.
    db = dbengine
    storage tiers = 3
    dbengine tier 0 retention size = 512MiB
    dbengine tier 0 retention time = 14d
    dbengine tier 1 retention size = 256MiB
    dbengine tier 1 retention time = 3mo
    dbengine tier 2 retention size = 256MiB
    dbengine tier 2 retention time = 1y

[host labels]
    environment = production
    role = application-host
    stack = arbuzas
    access = tailscale-private

[web]
    # Keep the Netdata UI private on Arbuzas. Operators reach it through
    # the host's Tailscale HTTPS proxy instead of exposing a public listener.
    bind to = localhost:19999
