[package]
name = "ticket_remote_spacetimedb"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.6.*" }
log = "0.4"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = "0.10"
sha2 = "0.10"
